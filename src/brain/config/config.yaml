brain_node:
  ros__parameters:
    game:
      team_id: 31 # consistant with GameControl
      player_id: 1 # 1 | 2 | 3; unique per robot
      field_type: "adult_size" # adult_size | kid_size | robo_league
      player_role: "striker" # striker | goal_keeper
      player_start_pos: "right" # right | left
      treat_person_as_robot: false # 是否将人类视为机器人, 用于调试. !!!! 正式比赛时, 必须设置为 false !!!!
      number_of_players: 3
      goalkeeper_id: 3 # Same team-wide fallback when GC does not specify a goalkeeper
      controller_timeout_ms: 2000.0
    
    ball_predictor: 
      step_interval: 100. 
      step_cnt: 50 
      linear_steps: 5 
      linear_rsq_threshold: 0.98 
      acceleration: -0.4 

    # 新球路预测链路。默认只保留参数入口，不接管追球，详见 docs/ball_prediction_v1_6_plan.md。
    ball_prediction:
      enable: false
      use_for_chase: false
      predict_time: 0.25
      min_dt: 0.02
      max_dt: 0.20
      max_history_gap: 0.50
      max_speed: 4.0
      max_acceleration: 8.0
      # 定位球/边线球/出界阶段默认不让预测球接管追球，避免不开边线球。
      disable_for_set_play_chase: true
      # 预测链路最低置信度。brain 侧还会同时满足 strategy.ball_confidence_threshold。
      min_confidence: 40.0
      confidence_full: 100.0
      # 置信度越低，Kalman 测量噪声越大，低置信度观测权重越小。
      confidence_noise_gain: 2.0
      enable_kalman: true
      prefer_kalman_velocity: true
      process_noise_position: 0.03
      process_noise_velocity: 0.60
      measurement_noise: 0.06
      initial_covariance: 1.0
      lost_prediction_timeout: 0.4
      max_jump_distance: 1.2
      max_jump_speed: 6.0
      velocity_smoothing: 0.5
      acceleration_smoothing: 0.6
      min_motion_speed: 0.05
      # 默认不把差分加速度用于未来点，减少轨迹随机转向/抖动。
      acceleration_prediction_scale: 0.0
      trajectory_step: 0.1
      trajectory_count: 20
      
    robot:
      robot_height: 0.90 
      odom_factor: 1.2 
      vx_factor: 0.90 
      yaw_offset: 0.0 
      vx_limit: 1.2
      vy_limit: 0.5
      vtheta_limit: 1.5

    strategy:
      ball_confidence_threshold: 30.0 
      ball_confidence_decay_rate: 3.0 
      enable_stable_kick: false 
      ball_memory_timeout: 3.0 
      tm_ball_dist_threshold: 1.5  
      limit_near_ball_speed: true
      near_ball_speed_limit: 0.6 
      near_ball_range: 2.0 
      soft_kickoff: true
      soft_kickoff_speed: 0.3 
      kick_range: 1.0
      kick_theta_range: 0.2
      adjust_timeout_secs: 0.0  # >0: adjust(绕球对位)持续超过该秒数则强制退回 chase, 防绕球死锁; 0=关闭(默认,行为不变)
      abort_kick_when_ball_moved: true 
      abort_kick_ball_move_threshold: 0.3 
      abort_shoot_when_ball_moved: true  
      limit_speed_near_border: false 
      near_border_speed_limit: 0.5
      near_border_dist_threshold: -1.0 
      enable_bypass: false 
      enable_shoot: false 
      enable_directional_kick: false 
      use_squat_block: true 
      squat_block_msecs: 2000.0 
      use_move_block: false 
      move_block_msecs: 2000.0 
      shoot:
        threat_threshold: -2.0 
        xmin: 0.3
        xmax: 0.6
        ymin: -0.3
        ymax: 0.3

      power_shoot:
        enable: false 
        use_for_kickoff: false 
        xmin: 1.1 
        xmax: 1.5 
        ymin: -0.3 
        ymax: 0.3 
      enable_auto_visual_kick: true
      auto_visual_kick_enable_dist_min: 0.2
      auto_visual_kick_enable_dist_max: 4.0
      auto_visual_kick_enable_angle: 0.8
      cooperation:
        owner_switch_margin: 0.3 # Seconds of touch-time advantage required to replace one owner

      role_assignment:
        gk_takeover: true # GC penalized goalkeeper -> smallest eligible ID; no active handover

      # 开球后触球前禁用 vision kick (方案任务1). 我方开球/任意球期间, 第一脚必须趟球触球而非 RL 视觉射门.
      kickoff_guard:
        enable: true
        ball_move_threshold: 0.3  # 球在 field 系位移超过 max(0.15*range, 该值) 视为已触球, 解除禁用
        move_confirm_frames: 3     # 连续可信观测均超过阈值才确认触球, 抑制单帧跳变
        localization_jump_threshold: 0.25 # odom->field 平移突变超过此值(m)时重锁基准

      # 站位战术 (方案任务4). 总开关, false=全部回退旧站位节点.
      formation:
        enable: false
        assign_by_distance: false      # 3v3 默认按 playerId 确定性对号; true 仅用于多机验证后的实验性就近分配
        replan_ball_move_threshold: 0.5 # 球位移超过此值(m)触发站位重算
        replan_debounce_msecs: 500.0
        keep_away_dist: 1.5            # 任意球摆位阶段全员距球合规距离


    obstacle_avoidance:
      depth_sample_step: 16 
      obstacle_min_height: 0.3 
      grid_size: 0.2 
      max_x: 3.0 
      max_y: 5.0 
      exclusion_x: 0.4 
      exclusion_y: 0.5 
      ball_exclusion_radius: 0.0 
      ball_exclusion_height: 0.3 
      occupancy_threshold: 20 
      collision_threshold: 0.3 
      safe_distance: 1.0 
      avoid_secs: 2.0 
      enable_freekick_avoid: true 
      freekick_start_placing_safe_distance: 0.5 
      freekick_start_placing_avoid_secs: 1.5 
      obstacle_memory_msecs: 500. 
      avoid_during_kick: false 
      kick_ao_safe_dist: 1.5 
      kick_ao_use_shoot: false 
      avoid_during_chase: true 
      chase_ao_safe_dist: 1.5 
      always_turn_left: false 

    RLVisionKick:
      visual_kick_version: kV2 # kV1 | kV2 修改此参数可更改visualkick调用版本
      # /kick_ball 消息的 power 字段 (期望踢行距离, m) 计算方式:
      # distance: power = clamp(球到对方球门距离 + power_overshoot, power_min, power_max), 全场(含中场)都给大脚
      # legacy:   球距门 <= legacy_full_power_dist 时给 power_max, 否则 power_min (旧行为: 只在对方半场纵深开大脚)
      power_mode: distance
      power_min: 2.0
      power_max: 6.0 # RL 策略已实测过的力度上限; 想中场直接吊门可实测确认策略支持后调大
      power_overshoot: 4.0 # 留出富余量, 距门 2m 时 power 恰为 6.0, 与旧版近门行为一致
      legacy_full_power_dist: 6.0

    locator:
      min_marker_count: 4
      max_residual: 0.4

    enable_com: True  # 是否开启队友间通信，建议打开

    # 队友间高置信度球位置共享 (独立 package k1_teammate_ball)。传输复用 enable_com 的底层 UDP 通讯。
    teammate_ball_share:
      enable: true # false disables sharing instead of selecting ungated teammate reports
      min_confidence_to_share: 50.0   # 自己置信度高于此值才视为可共享 (发送侧/调试用)
      min_confidence_to_trust: 50.0   # 队友球置信度高于此值才纳入融合 (核心: 高置信度门控)
      trust_timeout: 1.0 # Maximum age from actual source observation; fusion never renews it
      self_dist_threshold: 2.0        # 队友球须距我超过此值(m)才采信, 规避双方定位误差造成的大方向误判
      teammate_timeout: 1.0           # 队友报告超过此秒数视为过期
      require_location_known: true    # 是否要求队友自认球位已知才采信

    rerunLog:
      enable_tcp: false # 是否通过网络传输 log
      server_ip: "192.168.10.110:9876" # 开启了 rerun Viewer 的机器地址
      enable_file: false # 是否将 log 写入本地
      log_dir: "/home/booster/Workspace/rrlog" # 本地 log 存储路径, 会在此路径下生成以时间为开头的文件
      max_log_file_mins: 5.0 # 本地 log 最长多少分钟就分片存储. 太大的文件会导致读的时候死机.
      img_interval: 1 #每多少帧图像 log 一次, 如果希望更好的实时性或减少日志大小, 可以调高这个值. 但会造成 log 的时间精度降低.
    
    recovery:
      retry_max_count: 2

    vision:
      image_topic: "/boostercamera/head/rgb" #相机topic统一命名，topic名称不需更改
      depth_image_topic: "/boostercamera/head/depth" #相机topic统一命名，topic名称不需更改
      # cam_pixel_width: 544. # 相机像素宽度, d-robotics
      # cam_pixel_height: 448. # 相机像素高度, d-robotics
      cam_pixel_width: 1280. # 相机像素宽度 realsense
      cam_pixel_height: 720. # 相机像素高度 realsense
      cam_fov_x: 90.0 # 相机视场角, 单位: 度 realsense
      cam_fov_y: 60.0 # 相机视场角, 单位: 度 realsense
      # cam_fov_x: 69.4 # 相机视场角, 单位: 度, d-robotics
      # cam_fov_y: 42.5 # 相机视场角, 单位: 度, d-robotics    

    debug:
      log_ball_pos: false # 是否记录球位置到 ballpos.log 中, 用于调试
    
    game_control_ip: "192.168.74.2"  # 更改为具体的裁判机的 IP 地址

    # for fun
    sound:
      enable: true 
      sound_pack: "espeak" 
